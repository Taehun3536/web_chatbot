<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect AI | 지능형 대화 파트너</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat">
                    <span class="icon">+</span> 새 대화 시작
                </button>
            </div>
            <nav class="chat-history">
                <div class="history-label">최근 대화 기록</div>
                <ul id="history-list">
                    <li class="history-item active">✨ Connect AI 소개</li>
                    <li class="history-item">📁 프로젝트 기술 스택</li>
                    <li class="history-item">🎨 사용자 경험 가이드</li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">C</div>
                    <div class="info">
                        <p class="name">방문자님</p>
                        <p class="status">무료 플랜 사용 중</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 메인 채팅창 -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="header-left">
                    <div class="bot-status-dot"></div>
                    <h2>Connect AI Assistant</h2>
                </div>
                <div class="header-right">
                    <span class="version-tag">버전 2.1 베타</span>
                </div>
            </header>
            
            <section class="chat-content" id="chat-content">
                <div class="msg-row bot">
                    <div class="bubble">
                        안녕하세요! 당신과 세상을 잇는 스마트한 대화 파트너, <strong>Connect AI</strong>입니다. 
                        <br><br>
                        더 편리하고 풍요로운 일상을 위해 무엇을 도와드릴까요? 자유롭게 질문해 보세요.
                    </div>
                </div>
            </section>

            <footer class="chat-footer">
                <div class="input-group">
                    <input type="text" id="user-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                    <button id="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <p class="footer-note">Connect AI는 오류가 발생할 수 있으므로, 중요한 정보는 다시 한번 확인해 주시기 바랍니다.</p>
            </footer>
        </main>
    </div>
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
